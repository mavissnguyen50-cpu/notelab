{id:"sentence",n:"Sentence Method",c:0,d:0,g:["lec"],ic:"✍️",bg:"b2",f:0,s:"Mỗi ý là một câu ngắn trên một dòng, đánh số thứ tự.",w:"Bạn ghi mỗi thông tin mới thành một câu riêng rồi xuống dòng cho ý tiếp theo.",h:"Nghe hoặc đọc, rồi viết từng ý bằng một câu ngắn, không phân cấp.",u:"Khi bài giảng nhanh, nhiều thông tin rời rạc và khó chia cấu trúc.",p:["Ghi nhanh, bắt kịp bài giảng","Ít phải nghĩ về bố cục"],l:["Khó thấy mối liên hệ giữa các ý","Ghi chú dài, khó ôn nhanh"],st:["Đánh số mỗi dòng","Mỗi ý một câu ngắn","Xuống dòng khi sang ý mới","Sau buổi học, gạch chân các ý quan trọng"],m:["Viết câu quá dài","Không xem lại để chọn ý chính"],e:"Nghe một video 5 phút, ghi thành các câu đánh số rồi chọn 3 ý quan trọng nhất.",r:["outline","cornell"],v:"sent"},
{id:"chunking",n:"Chunking",c:2,d:0,g:["mem"],ic:"🧱",bg:"b3",f:0,s:"Chia thông tin dài thành các nhóm nhỏ có ý nghĩa.",w:"Kỹ thuật gom nhiều mẩu thông tin riêng lẻ thành vài nhóm dễ nhớ hơn.",h:"Tìm điểm chung giữa các mục, gom thành nhóm và đặt tên cho mỗi nhóm.",u:"Khi cần nhớ danh sách dài, dãy số hoặc chương sách nhiều khái niệm.",p:["Giảm cảm giác quá tải","Dễ kết hợp với sơ đồ tư duy"],l:["Gom sai nhóm có thể gây nhầm","Cần hiểu nội dung trước"],st:["Liệt kê tất cả mục","Tìm điểm chung","Gom thành 3–5 nhóm","Đặt tên cho mỗi nhóm","Tự nhắc lại từng nhóm"],m:["Gom nhóm tùy tiện","Nhóm quá lớn"],e:"Lấy 12 từ vựng mới, chia thành 3 nhóm theo chủ đề và thử nhớ lại.",r:["mindmap","recall"],v:"cards"},
{id:"mnemonic",n:"Mnemonics",c:2,d:1,g:["mem"],ic:"🎵",bg:"b4",f:0,s:"Dùng vần, chữ viết tắt hoặc hình ảnh để gắn vào thông tin khó nhớ.",w:"Là các mẹo ghi nhớ như câu vè, chữ cái đầu hoặc liên tưởng hình ảnh.",h:"Biến thông tin khô khan thành một cụm từ, hình ảnh hoặc câu chuyện dễ nhớ.",u:"Danh sách có thứ tự, thuật ngữ, công thức.",p:["Vui, dễ nhớ","Hữu ích cho danh sách"],l:["Không giúp hiểu bản chất","Phải tự tạo mẹo cho từng nội dung"],st:["Chọn thông tin cần nhớ","Lấy chữ cái đầu hoặc tìm hình ảnh","Ghép thành câu hoặc cảnh vui","Nhắc lại vài lần theo thời gian"],m:["Mẹo phức tạp hơn cả nội dung","Dùng mẹo mà không hiểu nội dung"],e:"Tạo một câu vè hoặc cụm viết tắt cho 5 ý bạn đang học.",r:["chunking","flash"],v:"qa"},
{id:"feynman",n:"Feynman Technique",c:4,d:1,g:["mem","lec"],ic:"👩‍🏫",bg:"b1",f:0,s:"Giải thích một ý bằng lời đơn giản để tìm chỗ mình chưa hiểu.",w:"Kỹ thuật tự giải thích như đang dạy một người chưa biết gì về chủ đề.",h:"Bạn viết lời giải thích đơn giản, chỗ nào bí chính là chỗ cần học lại.",u:"Khi học khái niệm khó và muốn kiểm tra mức hiểu thật sự.",p:["Phát hiện lỗ hổng kiến thức","Giúp hiểu sâu hơn"],l:["Tốn thời gian","Cần trung thực với bản thân"],st:["Chọn một khái niệm","Giải thích bằng lời đơn giản","Đánh dấu chỗ vấp","Quay lại tài liệu để học chỗ đó","Giải thích lại cho gọn hơn"],m:["Dùng thuật ngữ để che chỗ chưa hiểu","Đọc thuộc thay vì tự diễn đạt"],e:"Giải thích một khái niệm cho một người bạn (hoặc ghi âm) rồi nghe lại để tìm chỗ vấp.",r:["recall","cornell"],v:"qa"}];

à tiêu chí. Khi một ô còn trống, bạn biết ngay mình thiếu thông tin ở đâu.",sentence:"Phương pháp câu phù hợp khi giảng viên nói nhanh và liên tục. Mỗi câu chứa một ý trọn vẹn nên đọc lại vẫn hiểu, không bị đứt đoạn như khi chỉ ghi từ khóa. Điểm yếu là ghi chú dài, vì vậy hãy dành vài phút sau buổi học để đánh dấu các câu quan trọng và gom thành tóm tắt.",zettel:"Zettelkasten xem mỗi ghi chú là một ý độc lập, viết bằng lời của bạn và có mã riêng. Giá trị nằm ở các liên kết: khi thêm thẻ mới, bạn tự hỏi nó liên quan thẻ cũ nào và vì sao. Theo thời gian, kho thẻ trở thành mạng lưới ý tưởng giúp bạn viết bài và nghiên cứu.",recall:"Mỗi lần cố nhớ lại, não phải truy xuất thông tin thay vì chỉ nhận ra, và việc truy xuất này giúp củng cố trí nhớ. Cảm giác khó chịu khi chưa nhớ ra thường là dấu hiệu việc học đang có tác dụng. Hãy luôn thử nhớ trước rồi mới mở tài liệu đối chiếu.",spaced:"Ôn lặp lại ngắt quãng dựa trên quan sát rằng ta quên nhanh lúc đầu rồi chậm dần. Vì vậy các lần ôn đầu nên gần nhau, sau đó giãn ra. Không có lịch cố định nào đúng cho mọi người: nội dung khó hoặc ít dùng thường cần ôn dày hơn. Hãy xem mình quên chỗ nào để điều chỉnh.",flash:"Thẻ ghi nhớ hiệu quả nhất khi mỗi thẻ chỉ hỏi một ý và câu hỏi đủ cụ thể để trả lời trong vài giây. Hãy tự nói đáp án trước khi lật thẻ. Thẻ trả lời sai nên được xem lại sớm hơn, thẻ đã chắc thì giãn ra.",chunking:"Trí nhớ làm việc chỉ giữ được lượng nhỏ thông tin cùng lúc. Chunking gom nhiều mẩu thành vài nhóm có ý nghĩa, ví dụ nhớ số điện thoại theo cụm thay vì từng chữ số. Quan trọng là đặt tên cho mỗi nhóm để nhìn lại là nhớ cả cụm.",mnemonic:"Mẹo ghi nhớ gắn thông tin khô khan với thứ dễ nhớ hơn như vần, hình ảnh hoặc câu chuyện. Càng bất ngờ và sinh động, mẹo càng dễ đọng lại. Tuy vậy mẹo chỉ giúp nhớ thứ tự hoặc tên gọi, bạn vẫn cần học để hiểu nội dung.",feynman:"Khi giải thích bằng lời đơn giản, bạn không thể dựa vào thuật ngữ để che chỗ chưa hiểu. Chỗ nào bạn nói vấp hoặc phải vòng vo là lỗ hổng cần quay lại học. Hãy thử giải thích cho người chưa biết gì về chủ đề, rồi viết lại bản gọn hơn."};const FIX=[["Ghi chép quá nhiều","Bạn đang chép nguyên văn thay vì chọn lọc.","Chỉ ghi từ khóa và ý chính, diễn đạt lại bằng lời của mình.","Thay vì chép cả đoạn về quang hợp, chỉ ghi: ánh sáng + CO₂ + nước → đường + oxy."],["Highlight quá nhiều","Khi mọi thứ đều nổi bật thì không còn gì nổi bật.","Đọc hết một đoạn rồi mới tô, mỗi đoạn chỉ tô 1–2 cụm từ.","Chỉ tô cụm “lục lạp chứa diệp lục”, phần còn lại ghi chú bên lề."],["Không biết chọn ý chính","Bạn chưa tự hỏi điều gì thực sự quan trọng.","Tự hỏi: nếu chỉ nhớ được một câu thì đó là câu nào? Câu mở đầu và kết luận thường chứa ý chính.","Với bài Đường cong lãng quên, ý chính là: không ôn thì quên nhanh."],["Không ôn lại ghi chú","Ghi chú không được xem lại sẽ chỉ nằm trong vở.","Đặt lịch ôn ngắn 5–10 phút ngay sau buổi học, rồi vài ngày sau nữa.","Cuối buổi, che cột ghi chú Cornell và tự trả lời các câu hỏi bên trái."],["Đọc lại nhưng vẫn không nhớ","Đọc lại tạo cảm giác quen thuộc, chưa chắc là đã nhớ.","Đóng sách và tự nhớ lại (Active Recall), rồi đối chiếu với tài liệu.","Sau khi đọc một trang, viết ra 3 điều bạn nhớ trước khi mở sách."]];const INFO={about:["Giới thiệu","NOTE IT – REMEMBER IT là dự án học tập giúp bạn khám phá các cách ghi chú và ghi nhớ. Đây là bản prototype dùng dữ liệu mẫu."],contact:["Liên hệ","Bản prototype chưa có biểu mẫu liên hệ hoạt động. Khi triển khai thật, thông tin liên hệ sẽ hiển thị tại đây."],privacy:["Quyền riêng tư","Dữ liệu cá nhân (mục đã lưu, tiến độ) chỉ nằm trong trình duyệt của bạn và không được gửi đi đâu cả."],rules:["Nguyên tắc cộng đồng","Tôn trọng người học khác, chia sẻ nội dung chính xác và ghi rõ nguồn khi trích dẫn."]};

function map(t){const n=t.f.length;let o=`<svg viewBox="0 0 400 300" role="img" aria-label="Sơ đồ tư duy ${t.n}" style="width:100%;max-width:460px"><g stroke="var(--ac)" stroke-width="2">`;const P=t.f.map((f,i)=>{const a=i*2*Math.PI/n-Math.PI/2;return[200+130*Math.cos(a),150+105*Math.sin(a),f]});P.forEach(p=>o+=`<line x1="200" y1="150" x2="${p[0]}" y2="${p[1]}"/>`);o+=`</g><circle cx="200" cy="150" r="42" fill="var(--ac)"/><text x="200" y="154" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${t.n.slice(0,16)}</text>`;P.forEach(p=>o+=`<foreignObject x="${p[0]-62}" y="${p[1]-30}" width="124" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="background:var(--yl);color:var(--tx);border-radius:10px;padding:4px 6px;font:11px/1.3 sans-serif"><b>${p[2].k}</b><br>${p[2].a.slice(0,34)}…</div></foreignObject>`);return o+'</svg>'}

function vis(m,t){t=t||T[0];const v=m.v;if(v==="sent")return `<ol>${t.f.map(f=>`<li>${f.a}</li>`).join('')}</ol>`;if(v==="cornell")return cornell(t);if(v==="map")return map(t);if(v==="outline")return outline(t);if(v==="table")return `<table><tr><th>Khía cạnh</th><th>Nội dung</th></tr>${t.f.map(f=>`<tr><td>${f.k}</td><td>${f.a}</td></tr>`).join('')}</table>`;if(v==="cards")return `<div class="two">${t.f.map((f,i)=>`<div class="box b${i+1}"><b>Thẻ ${i+1}: ${f.k}</b><p>${f.a}</p><small class="mu">Liên kết → thẻ ${(i+1)%t.f.length+1}</small></div>`).join('')}</div>`;if(v==="sched")return `<ol><li>Ôn lần 1: cùng ngày hoặc ngày hôm sau</li><li>Ôn lần 2: sau vài ngày</li><li>Ôn lần 3: sau khoảng một tuần</li><li>Ôn lần 4: sau 2–3 tuần</li></ol><p class="notice">Đây chỉ là ví dụ minh họa. Mỗi người, mỗi nội dung cần lịch khác nhau, hãy điều chỉnh theo mức nhớ của bạn.</p>`;return qa(t)}
function nav(){document.getElementById('nl').innerHTML=NAV.map(n=>`<button data-a="go" data-v="${n[0]}" class="${S.page===n[0]?'on':''}">${n[1]}</button>`).join('')+`<button data-a="search" aria-label="Tìm kiếm">🔍</button><button data-a="theme" aria-label="Chế độ sáng/tối">🌓</button><button class="btn s" data-a="go" data-v="explore">Khám phá ngay</button>`}
function home(){const m=M.filter(x=>x.f).slice(0,8);return `<section class="hero"><div><span class="tag">Phòng thí nghiệm ghi chú</span><h1>NOTE IT –<br><span>REMEMBER IT</span></h1><p><b>Ghi chú thông minh, ghi nhớ hiệu quả.</b> Đừng chỉ ghi chép, hãy học cách ghi nhớ.</p><p class="mu">Khám phá những phương pháp ghi chú thông minh, biến kiến thức phức tạp thành những ý tưởng dễ hiểu và dễ nhớ hơn.</p><div class="row" style="justify-content:flex-start"><button class="btn" data-a="go" data-v="explore">Khám phá phương pháp</button><button class="btn o" data-a="go" data-v="play">Thử thách ghi nhớ</button></div></div><svg class="mascot" viewBox="0 0 420 400" role="img" aria-label="Cuốn sổ tay cam đang vẫy tay chào, kèm logo của nhóm" style="width:100%;max-width:440px;justify-self:center"><path d="M60 250C40 160 130 110 210 120C300 90 400 130 395 230C390 320 300 365 200 350C120 345 70 320 60 250Z" fill="var(--ac)"/><path d="M70 215h90a18 18 0 0 0 0-36a22 22 0 0 0-40-10a24 24 0 0 0-50 14a16 16 0 0 0 0 32z" fill="#CFE5FF" opacity=".9"/><path d="M255 340h90a18 18 0 0 0 0-36a22 22 0 0 0-40-10a24 24 0 0 0-50 14a16 16 0 0 0 0 32z" fill="#fff" opacity=".4"/><path transform="translate(235 25) scale(.65)" d="M70 215h90a18 18 0 0 0 0-36a22 22 0 0 0-40-10a24 24 0 0 0-50 14a16 16 0 0 0 0 32z" fill="#CFE5FF" opacity=".75"/><path d="M75 290q15-14 30 0t30 0t30 0t30 0M300 255q12-12 24 0t24 0t24 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/><g transform="translate(28 -10) rotate(10 210 190)"><rect x="285" y="75" width="26" height="240" rx="4" fill="#fff" stroke="#222" stroke-width="3"/><rect x="110" y="70" width="190" height="250" rx="6" fill="var(--or)" stroke="#222" stroke-width="4"/><g fill="none" stroke="#222" stroke-width="4" stroke-linecap="round"><path d="M140 70c0-40 28-40 28 0"/><path d="M185 70c0-40 28-40 28 0"/><path d="M230 70c0-40 28-40 28 0"/><path d="M275 70c0-40 28-40 28 0"/><path d="M110 160q-40-20-45-60" stroke-width="6"/><path d="M300 230q40-10 60-45" stroke-width="6"/><path d="M185 205q20 18 40 0"/></g><circle cx="165" cy="170" r="12" fill="#222"/><circle cx="245" cy="170" r="12" fill="#222"/><circle cx="169" cy="166" r="4" fill="#fff"/><circle cx="249" cy="166" r="4" fill="#fff"/><ellipse cx="140" cy="205" rx="18" ry="11" fill="#ff4d4d"/><ellipse cx="270" cy="205" rx="18" ry="11" fill="#ff4d4d"/><rect x="235" y="275" width="50" height="30" rx="4" fill="#fff" opacity=".3"/></g><g transform="rotate(-6 62 320)"><rect x="2" y="244" width="120" height="152" rx="14" fill="#fff" stroke="#222" stroke-width="3"/><clipPath id="lc"><rect x="8" y="250" width="108" height="124" rx="10"/></clipPath><image href="${LOGO}" x="8" y="250" width="108" height="124" preserveAspectRatio="xMidYMid slice" clip-path="url(#lc)"/><text x="62" y="389" text-anchor="middle" font-size="11" font-weight="700" fill="#222">Nhóm thực hiện</text></g></svg></section>
<section><h2>Khám phá theo mục tiêu</h2><div class="grid">${Object.keys(GOALS).map(g=>`<button class="card goal" data-a="goal" data-v="${g}"><div style="font-size:1.8rem">${GI[g]}</div><b>${GOALS[g]}</b></button>`).join('')}</div></section>
<section><h2>Phương pháp nổi bật</h2><div class="grid">${m.map(card).join('')}</div></section>
<section><h2>Trước và sau</h2><div class="row" style="justify-content:flex-start"><button class="tab ${S.ba?'':'on'}" data-a="ba" data-v="0" aria-pressed="${!S.ba}">Ghi chú ban đầu</button><button class="tab ${S.ba?'on':''}" data-a="ba" data-v="1" aria-pressed="${!!S.ba}">Ghi chú đã cải thiện</button></div><div class="box">${S.ba?cornell(T[0])+`<p class="mu" style="margin-top:12px"><b>Điều gì đã đổi?</b> Thông tin được chia thành câu hỏi, ý chính và tóm tắt. Nhờ vậy bạn có thể che đáp án để tự kiểm tra.</p>`:`<p class="messy" style="padding:14px">quang hợp... cây lấy ánh sáng, co2 nước → đường?? ở lá, lục lạp (diệp lục) tạo oxy nữa, nhớ thi!!</p><p class="mu">Đầy đủ ý nhưng lẫn lộn, khó ôn và khó tự kiểm tra.</p>`}</div></section>
<section><h2>Thử thách trí nhớ</h2>${chal()}</section>
<section><h2>Phòng thí nghiệm ghi nhớ</h2><div class="grid">${['recall','spaced','chunking','mnemonic','feynman'].map(i=>card(get(i))).join('')}</div></section>
<section><h2>Góc sửa lỗi ghi chú</h2><div class="row" style="justify-content:flex-start">${FIX.map((x,i)=>`<button class="tab ${(S.fx||0)===i?'on':''}" data-a="fx" data-v="${i}" aria-pressed="${(S.fx||0)===i}">${x[0]}</button>`).join('')}</div><div class="box"><p><b>Vì sao?</b> ${FIX[S.fx||0][1]}</p><p><b>Cách sửa:</b> ${FIX[S.fx||0][2]}</p><p class="notice"><b>Ví dụ:</b> ${FIX[S.fx||0][3]}</p></div></section>
<section><h2>Mẹo học hôm nay</h2>${(()=>{const t=TIPS[new Date().getDate()%3];return `<div class="box b3"><h3>${t[0]}</h3><p>${t[1]}</p><button class="btn s" data-a="m" data-v="${t[2]}">Xem phương pháp liên quan</button></div>`})()}</section>`}
function chal(){const c=S.ch;if(c.s===0)return `<div class="box"><p>${CH.p}</p><button class="btn" data-a="ch1">Ẩn đoạn văn và trả lời</button></div>`;if(c.s===1)return `<div class="box"><p class="mu">Đoạn văn đã được ẩn. Hãy trả lời từ trí nhớ.</p>${CH.q.map((q,i)=>`<fieldset><legend><b>${i+1}. ${q.t}</b></legend>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</fieldset>`).join('')}${c.err?`<p class="no" role="alert">${c.err}</p>`:''}<button class="btn" data-a="ch2">Nộp bài</button></div>`;const sc=c.a.filter((a,i)=>a===CH.q[i].a).length;return `<div class="box"><h3>Kết quả: ${sc}/${CH.q.length}</h3><div class="pb"><i style="width:${sc/CH.q.length*100}%"></i></div>${CH.q.map((q,i)=>`<p><span class="${c.a[i]===q.a?'ok':'no'}">${c.a[i]===q.a?'Đúng':'Chưa đúng'}</span> – ${q.t}<br><small class="mu">${q.x}</small></p>`).join('')}<button class="btn" data-a="ch0">Thử lại</button></div>`}
function explore(){return `<section><h1>Thư viện phương pháp</h1><div class="fl"><div><label for="q">Tìm kiếm</label><input id="q" type="search" value="${esc(S.q)}" placeholder="Tên hoặc từ khóa"></div><div><label for="cat">Danh mục</label><select id="cat"><option value="">Tất cả</option>${CATS.map((c,i)=>`<option value="${i}" ${S.cat===String(i)?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="diff">Độ khó</label><select id="diff"><option value="">Tất cả</option>${DIFF.map((c,i)=>`<option value="${i}" ${S.diff===String(i)?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="goal">Mục tiêu</label><select id="goal"><option value="">Tất cả</option>${Object.keys(GOALS).map(g=>`<option value="${g}" ${S.goal===g?'selected':''}>${GOALS[g]}</option>`).join('')}</select></div><div><label for="sort">Sắp xếp</label><select id="sort"><option value="f">Nổi bật</option><option value="n" ${S.sort==='n'?'selected':''}>Tên</option><option value="c" ${S.sort==='c'?'selected':''}>Danh mục</option></select></div></div><div id="lst"></div></section>`}
function lst(){let r=M.filter(m=>(!S.q||(m.n+m.s+m.w).toLowerCase().includes(S.q.toLowerCase()))&&(S.cat===''||m.c==S.cat)&&(S.diff===''||m.d==S.diff)&&(!S.goal||m.g.includes(S.goal)));r.sort((a,b)=>S.sort==='n'?a.n.localeCompare(b.n):S.sort==='c'?a.c-b.c:b.f-a.f);document.getElementById('lst').innerHTML=r.length?`<p class="mu">${r.length} phương pháp</p><div class="grid">${r.map(card).join('')}</div>`:`<div class="box"><b>Không tìm thấy kết quả${S.q?` cho “${esc(S.q)}”`:''}.</b><p class="mu">Hãy thử từ khóa khác hoặc xóa bộ lọc.</p><button class="btn s" data-a="clr">Xóa bộ lọc</button></div>`}
function detail(){const m=get(S.id),sv=S.saved.includes(m.id),tr=S.todo.includes(m.id);const sec=(h,b)=>`<section style="padding:18px 0"><h2>${h}</h2>${b}</section>`,ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;return `<section><span class="tag">${CATS[m.c]} · ${DIFF[m.d]}</span><h1>${m.ic} ${m.n}</h1><p class="mu">${m.s}</p><div class="row" style="justify-content:flex-start"><button class="btn" data-a="sv" data-v="${m.id}">${sv?'★ Đã lưu':'☆ Lưu vào bộ sưu tập'}</button><button class="btn o" data-a="td" data-v="${m.id}">${tr?'Bỏ khỏi danh sách muốn thử':'Muốn thử'}</button></div>
${sec('Đây là gì?',`<p>${m.w}</p>`)}${sec('Cách hoạt động',`<p>${m.h}</p>`)}${DEEP[m.id]?sec('Tìm hiểu sâu hơn',`<p>${DEEP[m.id]}</p>`):''}${sec('Khi nào nên dùng',`<p>${m.u}</p>`)}<div class="two"><div class="box b2"><b>Ưu điểm</b>${ul(m.p)}</div><div class="box b3"><b>Hạn chế</b>${ul(m.l)}</div></div>${sec('Các bước thực hiện',`<ol>${m.st.map(x=>`<li>${x}</li>`).join('')}</ol>`)}${sec('Ví dụ trực quan',`<p class="mu">Văn bản gốc: “${T[0].f.map(f=>f.a).join(' ')}”</p><div class="box">${vis(m)}</div>`)}${sec('Lỗi thường gặp',ul(m.m))}${sec('Bài tập thực hành',`<div class="box b4"><p>${m.e}</p><button class="btn s" data-a="dn" data-v="${m.id}">${S.done.includes('ex-'+m.id)?'✓ Đã hoàn thành':'Đánh dấu hoàn thành'}</button></div>`)}${sec('Phương pháp liên quan',`<div class="grid">${m.r.map(i=>card(get(i))).join('')}</div>`)}</section>`}
function play(){const t=T[0];const tabs=[["cornell","Cornell"],["outline","Dàn ý"],["map","Mind map"]];const fc=S.fc,cs=T.flatMap(x=>x.f);let f;if(fc.i>=cs.length)f=`<div class="box"><h3>Hoàn thành phiên luyện tập!</h3><p>Đã xem ${fc.seen} thẻ, nhớ ${fc.ok} thẻ.</p><button class="btn" data-a="fcr">Bắt đầu lại</button></div>`;else f=`<div class="box fc" tabindex="0" role="button" data-a="fcf">${fc.flip?'<span><b>Đáp án:</b> '+cs[fc.i].a+'</span>':cs[fc.i].q}</div><p class="mu">Thẻ ${fc.i+1}/${cs.length} · Đã xem: ${fc.seen}${fc.flip?'':' · Bấm thẻ để lật'}</p><div class="row" style="justify-content:flex-start">${fc.flip?`<button class="btn o" data-a="fcn">Chưa nhớ</button><button class="btn" data-a="fcy">Đã nhớ</button>`:`<button class="btn" data-a="fcf">Lật thẻ</button>`}<button class="btn s o" data-a="fcr">Làm lại</button></div>`;return `<section><h1>Phòng thực hành</h1><h2>A. Biến đổi ghi chú</h2><p class="notice">Đây là ví dụ dựng sẵn để minh họa, không phải ghi chú tự động sinh ra.</p><p class="mu">Đoạn gốc: “${t.f.map(f=>f.a).join(' ')}”</p><div class="row" style="justify-content:flex-start">${tabs.map(x=>`<button class="tab ${S.tf===x[0]?'on':''}" data-a="tf" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><div class="box">${S.tf==='cornell'?cornell(t):S.tf==='outline'?outline(t):map(t)}</div><h2 style="margin-top:30px">B. Thử thách trí nhớ</h2>${chal()}<h2 style="margin-top:30px">C. Thẻ ghi nhớ</h2>${f}</section>`}
function compare(){const t=T[S.top];return `<section><h1>Một chủ đề, nhiều cách ghi chú</h1><div class="fl"><div><label for="top">Chọn chủ đề</label><select id="top">${T.map((x,i)=>`<option value="${i}" ${S.top===i?'selected':''}>${x.n}</option>`).join('')}</select></div></div><p class="mu">Cả bốn dạng bên dưới dùng cùng một nguồn thông tin.</p><div class="two"><div class="box"><h3>${FMT.cornell[0]}</h3>${cornell(t)}</div><div class="box"><h3>${FMT.map[0]}</h3>${map(t)}</div><div class="box"><h3>${FMT.outline[0]}</h3>${outline(t)}</div><div class="box"><h3>${FMT.flash[0]}</h3>${t.f.map(f=>`<details><summary>${f.q}</summary><p class="mu">${f.a}</p></details>`).join('')}</div></div><h2 style="margin-top:30px">Điểm mạnh, hạn chế, khi nào dùng</h2><div style="overflow-x:auto"><table><tr><th>Cách</th><th>Điểm mạnh</th><th>Hạn chế</th><th>Phù hợp</th></tr>${Object.values(FMT).map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</table></div></section>`}
function space(){const l=a=>a.length?`<div class="grid">${a.map(i=>card(get(i))).join('')}</div>`:`<p class="mu">Chưa có mục nào.</p>`;const tot=4,pr=Math.round(S.done.filter(x=>['ch','fc','tf','cmp'].includes(x)).length/tot*100);return `<section><h1>Không gian của tôi</h1><p class="notice">Chức năng demo: dữ liệu chỉ lưu trên trình duyệt này, không đồng bộ giữa các thiết bị.</p><h2>Tiến độ học tập: ${pr}%</h2><div class="pb"><i style="width:${pr}%"></i></div><p class="mu">Hoàn thành: thử thách trí nhớ, thẻ ghi nhớ, biến đổi ghi chú, trang so sánh.</p><h2>Đã lưu</h2>${l(S.saved)}<h2>Muốn thử</h2>${l(S.todo)}<h2>Xem gần đây</h2>${l(S.recent)}<h2>Bài tập đã làm</h2>${S.done.filter(x=>x.startsWith('ex-')).length?`<ul>${S.done.filter(x=>x.startsWith('ex-')).map(x=>`<li>${get(x.slice(3)).n}</li>`).join('')}</ul>`:'<p class="mu">Chưa có bài tập nào.</p>'}<h2>Checklist ôn tập</h2>${CHK.map((c,i)=>`<label class="opt"><input type="checkbox" data-a="ck" data-v="${i}" ${S.chk.includes(i)?'checked':''}> ${c}</label>`).join('')}</section>`}
function info(){const i=INFO[S.info];return `<section><h1>${i[0]}</h1><p>${i[1]}</p></section>`}
function render(){nav();const a=document.getElementById('app');a.innerHTML=({home,explore,detail,play,compare,space,info})[S.page]();if(S.page==='explore')lst();if(S.page==='compare')mark('cmp')}
function go(p,keep){S.page=p;if(!keep)window.scrollTo(0,0);document.getElementById('nl').classList.remove('open');render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(t.tagName==='INPUT'&&a!=='ck')return;
if(a==='go'){if(v==='explore'){S.q='';S.cat=S.diff=S.goal=''}go(v)}
else if(a==='menu')document.getElementById('nl').classList.toggle('open');
else if(a==='goal'){S.q='';S.cat=S.diff='';S.goal=v;go('explore')}
else if(a==='m'){S.id=v;S.recent=[v,...S.recent.filter(x=>x!==v)].slice(0,6);L.set('rc',S.recent);go('detail')}
else if(a==='sv'){S.saved=S.saved.includes(v)?S.saved.filter(x=>x!==v):[...S.saved,v];L.set('sv',S.saved);render()}
else if(a==='td'){S.todo=S.todo.includes(v)?S.todo.filter(x=>x!==v):[...S.todo,v];L.set('td',S.todo);go('detail',1)}
else if(a==='dn'){mark('ex-'+v);go('detail',1)}
else if(a==='ba'){S.ba=+v;render()}
else if(a==='tf'){S.tf=v;mark('tf');render()}
else if(a==='ch1'){S.ch={s:1,a:[],err:""};render()}
else if(a==='ch0'){S.ch={s:0,a:[],err:""};render()}
else if(a==='ch2'){const an=CH.q.map((q,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`);return r?+r.value:-1});if(an.includes(-1)){S.ch.err="Vui lòng trả lời tất cả câu hỏi.";render();return}S.ch={s:2,a:an,err:""};mark('ch');render()}
else if(a==='fcf'){S.fc.flip=1;render()}
else if(a==='fcn'||a==='fcy'){S.fc.seen++;if(a==='fcy')S.fc.ok++;S.fc.i++;S.fc.flip=0;if(S.fc.i>=T.flatMap(x=>x.f).length)mark('fc');render()}
else if(a==='fcr'){S.fc={i:0,flip:0,seen:0,ok:0};render()}
else if(a==='ck'){const i=+v;S.chk=S.chk.includes(i)?S.chk.filter(x=>x!==i):[...S.chk,i];L.set('ck',S.chk)}
else if(a==='clr'){S.q='';S.cat=S.diff=S.goal='';render()}
else if(a==='info'){S.info=v;go('info')}
else if(a==='fx'){S.fx=+v;render()}
else if(a==='top')window.scrollTo({top:0,behavior:'smooth'});
else if(a==='theme'){const r=document.documentElement;const d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';L.set('th',r.dataset.theme)}
else if(a==='search'){S.q='';go('explore');document.getElementById('q').focus()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='fcf'&&e.target.tagName==='DIV'){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;lst()}});
document.addEventListener('change',e=>{const i=e.target.id;if(['cat','diff','goal','sort'].includes(i)){S[i]=e.target.value;lst()}if(i==='top'){S.top=+e.target.value;render()}});
render();
window.addEventListener('scroll',()=>{document.getElementById('up').style.display=window.scrollY>400?'block':'none'});
document.querySelector('.lg').src=LOGO;const th=L.get('th',null);if(th)document.documentElement.dataset.theme=th;
</script></body></html>
